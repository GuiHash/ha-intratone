[tool.ruff]
# Oldest Python in the CI matrix.
target-version = "py312"
# Default rule set (E4/E7/E9 + F) — lint for real defects, not style.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# opuslib uses `is not 0` instead of `!= 0` — upstream bug, not ours
filterwarnings = ["ignore::SyntaxWarning:opuslib"]
# Slowest test measured at ~20s; 300s gives ample headroom so a hung
# asyncio test fails fast instead of holding a CI runner indefinitely.
timeout = 300

[tool.coverage.run]
source = ["custom_components/intratone"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
